name: Documentation checks
on:
  push:
    paths: ['docs/**', 'AGENTS.md', '.github/workflows/docs-check.yml']
  pull_request:
    paths: ['docs/**', 'AGENTS.md', '.github/workflows/docs-check.yml']
permissions:
  contents: read
jobs:
  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative Markdown links
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re,sys,urllib.parse
          bad=[]
          for f in [pathlib.Path('AGENTS.md'),*pathlib.Path('docs').rglob('*.md')]:
              if not f.exists(): continue
              for target in re.findall(r'(?<!\!)\[[^\]]+\]\(([^)]+)\)',f.read_text('utf-8')):
                  path=urllib.parse.unquote(target.split('#')[0].split('?')[0])
                  if not path or '://' in path or path.startswith(('mailto:','#')): continue
                  if not (f.parent/path).exists(): bad.append(f'{f}: {target}')
          if bad:
              print('Broken relative links:\n'+'\n'.join(bad))
              sys.exit(1)
          print('Relative Markdown links OK')
          PY
